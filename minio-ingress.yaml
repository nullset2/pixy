apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ingress
  namespace: default
  annotations:
    ingress.kubernetes.io/protocol: https
spec:
  ingressClassName: traefik
  rules:
    - host: minio.the-null-log.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
